<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1030">
  <title>Samsons spil</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <h1>Samsons spil</h1>

    <nav class="banners" aria-label="Spil">
      <a class="banner" href="samsonsjulekamp/">
        <img src="samsonsjulekamp/banner.png" width="2400" height="960"
          alt="En lille nisse skyder snebolde mod den onde julemand i hans slæde, mens sure gaver flyver omkring dem.">
        <span class="banner-text">
          <span class="banner-title">Samsons julekamp</span>
          <span class="banner-tagline">Skyd den onde julemand og red julen!</span>
        </span>

      <a class="banner" href="monkeytimer/">
        <img src="monkeytimer/banner.png" width="2400" height="960"
          alt="En abe kaster bananskræller, og en gorilla med krone glider i dem, mens kokosnødder flyver gennem luften.">
        <span class="banner-text">
          <span class="banner-title">Monkey Timer</span>
          <span class="banner-tagline">Hop over husene og saml bananer!</span>
        </span>
      </a>
    </nav>
