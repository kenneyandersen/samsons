<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey Timer</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../logo/favicon-32.png">
    <link rel="icon" type="image/svg+xml" href="../logo/favicon.svg">
    <link rel="apple-touch-icon" href="../logo/apple-touch-icon.png">
    <style>
        body {
            margin: 0;
            background-color: #f7f7f7;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        #gameCanvas {
            border-bottom: 5px solid #22c55e; /* Grøn kant i bunden */
            background-color: #bae6fd; /* Flot blå himmel */
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border-radius: 4px;
            /* Skalér ned, så spillet passer på en telefon, også på tværs. */
            width: min(calc(100vw - 16px), 800px, calc((100vh - 180px) * 8 / 3));
            width: min(calc(100vw - 16px), 800px, calc((100dvh - 180px) * 8 / 3));
            height: auto;
        }
        #uiContainer {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 4px 16px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 18px;
            border-radius: 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        #levelBox {
            color: #b45309;
        }
        .keys {
            margin: 0;
            color: #555;
            font-size: 16px;
        }
        #controls {
            display: none;
            justify-content: space-between;
            width: calc(100vw - 16px);
            max-width: 800px;
        }
        .pad {
            display: flex;
            gap: 10px;
        }
        .pad button {
            min-width: 76px;
            height: 64px;
            padding: 0 8px;
            border: 2px solid #333;
            border-radius: 12px;
            background: #fff;
            color: #333;
            font: inherit;
            font-size: 22px;
            font-weight: 700;
            touch-action: none;
        }
        .pad button:active {
            background: #fde68a;
        }
        /* Gå og kast bruges kun under bosskampen. */
        body:not(.boss-mode) .boss-only {
            opacity: 0.35;
        }
        .back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 200px;
            min-height: 52px;
            padding: 10px 18px;
            box-sizing: border-box;
            border: 2px solid #333;
            border-radius: 8px;
            color: #333;
            font-size: 18px;
            font-weight: 700;
            text-decoration: none;
        }
        @media (hover: none) and (pointer: coarse) {
            .keys {
                display: none;
            }
            #controls {
                display: flex;
            }
            #gameCanvas {
                width: min(calc(100vw - 16px), 800px, calc((100dvh - 260px) * 8 / 3));
            }
        }
        /* Telefon på tværs: knapperne står på hver side af banen. */
        @media (hover: none) and (pointer: coarse) and (orientation: landscape) {
            body {
                display: grid;
                grid-template-columns: auto minmax(0, 1fr) auto;
                grid-template-rows: auto minmax(0, 1fr) auto;
                grid-template-areas:
                    "ui ui ui"
                    "left game right"
                    "back back back";
                justify-items: center;
                align-items: center;
                gap: 6px 10px;
                padding: 6px 10px;
                box-sizing: border-box;
            }
            #uiContainer { grid-area: ui; padding: 4px 16px; }
            #gameCanvas {
                grid-area: game;
                width: min(100%, calc((100dvh - 130px) * 8 / 3));
            }
            #controls { display: contents; }
            .pad { flex-direction: column; }
            .pad:first-child { grid-area: left; }
            .pad:last-child { grid-area: right; }
            .pad button { height: 58px; }
            .back { grid-area: back; min-height: 44px; padding: 6px 18px; }
        }
    </style>
</head>
<body>

    <div id="uiContainer">
        <div id="levelBox">Level <span id="level">1</span></div>
        <div>❤️ <span id="lives">3</span></div>
        <div>🍌 <span id="ammo">0</span></div>
        <div>Point: <span id="score">0</span></div>
        <div>Bedste: <span id="highScore">0</span></div>
    </div>
    <canvas id="gameCanvas" width="800" height="300"></canvas>
    <p class="keys">Mellemrum: hop &nbsp;·&nbsp; ← →: gå i bosskamp &nbsp;·&nbsp; X: kast bananskræl</p>
    <div id="controls">
        <div class="pad">
            <button id="btnLeft" class="boss-only" type="button" aria-label="Gå til venstre">◀</button>
            <button id="btnRight" class="boss-only" type="button" aria-label="Gå til højre">▶</button>
        </div>
        <div class="pad">
            <button id="btnThrow" class="boss-only" type="button">Kast</button>
            <button id="btnJump" type="button">Hop</button>
        </div>
    </div>
    <a class="back" href="../"><img src="../logo/mark-on-light.svg" alt="" width="32" height="32">Tilbage til alle spil</a>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const TAU = Math.PI * 2;
const groundY = 240; // Jorden er placeret ved 240px på skærmen

const START_LIVES = 3;
const MAX_LIVES = 5;
const MAX_AMMO = 12;
const HURT_SAFE_FRAMES = 90;

const GRAVITY = 0.6;
const JUMP_FORCE = -13;
const RUN_X = 75;
const WALK_SPEED = 4.5;
const ARENA_MIN_X = 20;
const ARENA_MAX_X = 340;

const THROW_COOLDOWN = 18;
const MAX_PEELS = 4;
const PEEL_LIFE = 480;
const PEEL_GROUND_Y = groundY - 8;
const SHOT_GRAVITY = 0.25;
const SHOT_GROUND_Y = groundY - 14;
const GROUND_BANANA_LIFE = 420;

const BOSS_SIZE = 80;
const BOSS_MIN_X = 360;
const BOSS_MAX_X = 700;
const BOSS_START_X = 640;
const BOSS_Y = groundY - BOSS_SIZE;

const BOSSES = [
    { name: "Gorilla Gunnar", icon: "🦍", hat: null },
    { name: "Orangutang Olga", icon: "🦧", hat: null },
    { name: "Bandit-Bent", icon: "🦍", hat: "🤠" },
    { name: "Kong Kokos", icon: "🦧", hat: "👑" },
];

// Alt, der gør hver boss sværere, står her.
const bossStats = (level) => ({
    hp: 2 + level,
    speed: Math.min(5, 1.5 + (level - 1) * 0.5),
    throwEvery: Math.max(45, 110 - (level - 1) * 12),
    coconuts: 1 + Math.floor((level - 1) / 2),
    flightFrames: Math.max(38, 58 - level * 3),
    rollingCoconuts: level >= 2,
    chargeEvery: level >= 2 ? Math.max(200, 480 - level * 40) : Infinity,
    chargeSpeed: 7 + level,
    coconutRain: level >= 3,
});

const obstaclesBeforeBoss = (level) => 10 + level * 2;
const runSpeed = (level) => Math.min(10, 5.5 + (level - 1) * 0.6);
const minObstacleGap = (level) => Math.max(55, 85 - level * 5);

const monkey = {
    x: RUN_X, y: groundY - 40, width: 40, height: 40,
    velocity: 0, isGrounded: true, invulnerable: 0, throwCooldown: 0,
};

let mode = "run"; // run, boss eller gameover
let level = 1;
let score = 0;
let highScore = 0;
let lives = START_LIVES;
let ammo = 0;
let restartLock = 0;

let scroll = 0;
let gameSpeed = runSpeed(1);
let spawnTimer = 0;
let nextGap = 90;
let passed = 0;
let shake = 0;
let banner = null;
let frameCount = 0;

let boss = null;
let obstacles = [];
let pickups = [];
let clouds = [];
let peels = [];
let shots = [];
let groundBananas = [];
let effects = [];

const keys = new Set();

const rand = (min, max) => min + Math.random() * (max - min);
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
const overlaps = (a, b) =>
    a.x < b.x + b.width && a.x + a.width > b.x && a.y < b.y + b.height && a.y + a.height > b.y;
const bossBox = () => ({ x: boss.x + 14, y: boss.y + 10, width: BOSS_SIZE - 28, height: BOSS_SIZE - 10 });
const shotBox = (shot) => ({ x: shot.x - 13, y: shot.y - 13, width: 26, height: 26 });

/* ---------- Styring ---------- */

function pressJump() {
    if (mode === "gameover") {
        if (restartLock <= 0) {
            resetGame();
        }
        return;
    }
    if (monkey.isGrounded) {
        monkey.velocity = JUMP_FORCE;
        monkey.isGrounded = false;
    }
}

function throwPeel() {
    if (mode !== "boss" || !boss || boss.state === "enter" || boss.state === "defeated") return;
    if (ammo <= 0 || monkey.throwCooldown > 0 || peels.length >= MAX_PEELS) return;
    ammo -= 1;
    monkey.throwCooldown = THROW_COOLDOWN;
    peels.push({ x: monkey.x + 30, y: monkey.y + 10, vx: 9.5, vy: -8, landed: false, life: PEEL_LIFE, rot: 0 });
}

window.addEventListener("keydown", (e) => {
    if (["Space", "ArrowUp", "ArrowLeft", "ArrowRight", "ArrowDown"].includes(e.code)) {
        e.preventDefault();
    }
    keys.add(e.code);
    if (e.repeat) return;
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") pressJump();
    if (e.code === "KeyX" || e.code === "KeyZ" || e.code === "Enter") throwPeel();
});
window.addEventListener("keyup", (e) => keys.delete(e.code));
window.addEventListener("blur", () => keys.clear());

// Tryk hvor som helst for at hoppe, undtagen på knapperne.
document.addEventListener("touchstart", (e) => {
    if (!e.target.closest("a, button")) {
        pressJump();
    }
});

function bindPress(id, onPress) {
    document.getElementById(id).addEventListener("pointerdown", (e) => {
        e.preventDefault();
        onPress();
    });
}

function bindHold(id, key) {
    const button = document.getElementById(id);
    button.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        button.setPointerCapture(e.pointerId);
        keys.add(key);
    });
    for (const type of ["pointerup", "pointercancel"]) {
        button.addEventListener(type, () => keys.delete(key));
    }
}

bindPress("btnJump", pressJump);
bindPress("btnThrow", throwPeel);
bindHold("btnLeft", "TouchLeft");
bindHold("btnRight", "TouchRight");

/* ---------- Spillets gang ---------- */

function resetGame() {
    mode = "run";
    level = 1;
    score = 0;
    lives = START_LIVES;
    ammo = 0;
    boss = null;
    obstacles = [];
    pickups = [];
    peels = [];
    shots = [];
    groundBananas = [];
    effects = [];
    clouds = [
        { x: 150, y: 30, speed: 0.6 },
        { x: 450, y: 60, speed: 0.4 },
        { x: 700, y: 40, speed: 0.7 }
    ];
    monkey.x = RUN_X;
    monkey.y = groundY - 40;
    monkey.velocity = 0;
    monkey.isGrounded = true;
    monkey.invulnerable = 0;
    startRun();
    banner = { title: "Level 1", subtitle: "", time: 70 };
}

function startRun() {
    gameSpeed = runSpeed(level);
    passed = 0;
    spawnTimer = 0;
    nextGap = 60;
}

function startBoss() {
    const info = BOSSES[(level - 1) % BOSSES.length];
    const stats = bossStats(level);
    mode = "boss";
    obstacles = [];
    pickups = [];
    boss = {
        ...info, stats,
        x: 860, y: BOSS_Y,
        hp: stats.hp, state: "enter", time: 0, dir: -1, slide: 0, spin: 0,
        fall: 0, throwTimer: 60, chargeTimer: stats.chargeEvery,
    };
    banner = {
        title: info.name,
        subtitle: level === 1 ? "Kast bananskræller, så den glider!" : "BOSSKAMP!",
        time: 130,
    };
}

function finishBoss() {
    level += 1;
    mode = "run";
    boss = null;
    peels = [];
    shots = [];
    groundBananas = [];
    lives = Math.min(MAX_LIVES, lives + 1);
    monkey.invulnerable = 60;
    startRun();
    banner = { title: `Level ${level}!`, subtitle: "+1 liv", time: 90 };
}

function hurt() {
    if (monkey.invulnerable > 0 || mode === "gameover") return;
    lives -= 1;
    monkey.invulnerable = HURT_SAFE_FRAMES;
    shake = 10;
    addEffect("💥", monkey.x + 20, monkey.y + 10);
    if (lives <= 0) {
        mode = "gameover";
        restartLock = 35;
        highScore = Math.max(highScore, score);
    }
}

function addEffect(icon, x, y) {
    effects.push({ icon, x, y, life: 40 });
}

/* ---------- Opdatering ---------- */

function step() {
    frameCount += 1;
    updateClouds();
    if (shake > 0) shake -= 1;
    if (banner && --banner.time <= 0) banner = null;

    effects = effects.filter((effect) => {
        effect.y -= 0.8;
        return --effect.life > 0;
    });

    if (mode === "gameover") {
        restartLock -= 1;
    } else {
        updateMonkey();
        if (mode === "run") {
            updateRun();
        } else {
            updateBoss();
        }
    }
    updateUi();
}

function updateClouds() {
    if (Math.random() < 0.006 && clouds.length < 6) {
        clouds.push({ x: canvas.width, y: 15 + Math.random() * 65, speed: 0.4 + Math.random() * 0.8 });
    }
    clouds = clouds.filter((cloud) => {
        cloud.x -= cloud.speed;
        return cloud.x > -60;
    });
}

function updateMonkey() {
    if (monkey.invulnerable > 0) monkey.invulnerable -= 1;
    if (monkey.throwCooldown > 0) monkey.throwCooldown -= 1;

    if (mode === "boss") {
        const right = keys.has("ArrowRight") || keys.has("KeyD") || keys.has("TouchRight");
        const left = keys.has("ArrowLeft") || keys.has("KeyA") || keys.has("TouchLeft");
        monkey.x = clamp(monkey.x + ((right ? 1 : 0) - (left ? 1 : 0)) * WALK_SPEED, ARENA_MIN_X, ARENA_MAX_X);
    } else if (monkey.x !== RUN_X) {
        // Tilbage til startpladsen, når banen begynder at køre igen.
        monkey.x += clamp(RUN_X - monkey.x, -3, 3);
    }

    monkey.velocity += GRAVITY;
    monkey.y += monkey.velocity;
    if (monkey.y >= groundY - 40) {
        monkey.y = groundY - 40;
        monkey.velocity = 0;
        monkey.isGrounded = true;
    }
}

function updateRun() {
    scroll += gameSpeed;

    if (++spawnTimer > nextGap && passed + obstacles.length < obstaclesBeforeBoss(level)) {
        spawnTimer = 0;
        const gap = minObstacleGap(level);
        nextGap = Math.floor(rand(gap, gap + 70));
        obstacles.push({ x: canvas.width, y: groundY - 35, width: 35, height: 35 });

        if (Math.random() > 0.3) {
            pickups.push({
                kind: "banana", x: canvas.width + rand(0, 40), y: groundY - 140 - rand(0, 50), width: 25, height: 25,
            });
        }
        if (lives < MAX_LIVES && Math.random() < 0.18) {
            pickups.push({ kind: "heart", x: canvas.width + 120, y: groundY - 125, width: 28, height: 28 });
        }
    }

    pickups = pickups.filter((pickup) => {
        pickup.x -= gameSpeed;
        if (overlaps(monkey, pickup)) {
            if (pickup.kind === "heart") {
                lives = Math.min(MAX_LIVES, lives + 1);
                addEffect("❤️", pickup.x, pickup.y);
            } else {
                ammo = Math.min(MAX_AMMO, ammo + 1);
                score += 5;
            }
            return false;
        }
        return pickup.x + pickup.width > 0;
    });

    obstacles = obstacles.filter((obstacle) => {
        obstacle.x -= gameSpeed;
        if (overlaps(monkey, obstacle)) {
            hurt();
        }
        if (obstacle.x + obstacle.width < 0) {
            score += 1;
            passed += 1;
            return false;
        }
        return true;
    });

    if (mode === "run" && passed >= obstaclesBeforeBoss(level)) {
        startBoss();
    }
}

function updateBoss() {
    updateBossMovement();
    if (!boss) return;
    updatePeels();
    updateShots();
    updateGroundBananas();
}

function updateBossMovement() {
    const { stats } = boss;
    boss.time += 1;

    switch (boss.state) {
        case "enter":
            boss.x -= 3;
            if (boss.x <= BOSS_START_X) {
                boss.state = "walk";
            }
            return;

        case "walk":
            boss.x += boss.dir * stats.speed;
            if (boss.x >= BOSS_MAX_X) boss.dir = -1;
            if (boss.x <= BOSS_MIN_X && boss.dir < 0) boss.dir = 1;
            if (--boss.throwTimer <= 0) {
                boss.throwTimer = stats.throwEvery;
                bossThrow();
            }
            if (--boss.chargeTimer <= 0 && boss.x > 300) {
                boss.state = "windup";
                boss.time = 0;
                boss.dir = -1;
            }
            break;

        case "windup":
            if (boss.time >= 45) {
                boss.state = "charge";
            }
            break;

        case "charge":
            boss.x -= stats.chargeSpeed;
            if (boss.x <= 20) {
                boss.state = "walk";
                boss.dir = 1;
                boss.chargeTimer = stats.chargeEvery;
            }
            break;

        case "slip":
            boss.x = clamp(boss.x + boss.slide, 20, BOSS_MAX_X);
            boss.slide *= 0.94;
            boss.spin += 0.09;
            if (boss.time >= 80) {
                boss.state = "walk";
                boss.spin = 0;
                boss.dir = boss.x > (BOSS_MIN_X + BOSS_MAX_X) / 2 ? -1 : 1;
                boss.throwTimer = Math.min(boss.throwTimer, 40);
            }
            return;

        case "defeated":
            boss.x += 3;
            boss.fall += 0.35;
            boss.y += boss.fall - 5;
            boss.spin += 0.15;
            if (boss.time >= 100) {
                finishBoss();
            }
            return;
    }

    if (overlaps(monkey, bossBox())) {
        hurt();
    }
}

function bossThrow() {
    const { stats } = boss;
    const bananasAround = ammo + peels.length + groundBananas.length + shots.filter((s) => s.kind === "banana").length;

    // Der skal altid være noget at kaste med, så man aldrig sidder fast.
    if (bananasAround === 0 || Math.random() < 0.3) {
        launchShot("banana", rand(60, 320));
        return;
    }
    for (let i = 0; i < stats.coconuts; i++) {
        launchShot("coconut", clamp(monkey.x + 20 + rand(-40, 40) + i * 70, ARENA_MIN_X, ARENA_MAX_X));
    }
    if (stats.coconutRain && Math.random() < 0.5) {
        shots.push({ kind: "coconut", x: monkey.x + 20, y: -20, vx: 0, vy: 2, rolling: false, rot: 0 });
    }
}

function launchShot(kind, targetX) {
    const startX = boss.x + 20;
    const startY = boss.y + 10;
    const frames = boss.stats.flightFrames;
    shots.push({
        kind,
        x: startX,
        y: startY,
        vx: (targetX - startX) / frames,
        vy: (SHOT_GROUND_Y - startY - 0.5 * SHOT_GRAVITY * frames * frames) / frames,
        rolling: false,
        rot: 0,
    });
}

function updatePeels() {
    peels = peels.filter((peel) => {
        if (peel.landed) {
            if (--peel.life <= 0) return false;
            if (["walk", "windup", "charge"].includes(boss.state) && Math.abs(peel.x - (boss.x + BOSS_SIZE / 2)) < 28) {
                slipBoss();
                return false;
            }
            return true;
        }

        // Rammer skrællen gorillaen i luften, falder den ned for fødderne af den.
        if (boss.state !== "defeated" && overlaps({ x: peel.x - 8, y: peel.y - 8, width: 16, height: 16 }, bossBox())) {
            peel.vx = 0;
        }
        peel.vy += 0.5;
        peel.x += peel.vx;
        peel.y += peel.vy;
        peel.rot += 0.3;
        if (peel.y >= PEEL_GROUND_Y) {
            peel.y = PEEL_GROUND_Y;
            peel.landed = true;
            peel.rot = 0;
        }
        return peel.x < canvas.width + 20;
    });
}

function slipBoss() {
    boss.hp -= 1;
    boss.state = "slip";
    boss.time = 0;
    boss.spin = 0;
    boss.slide = boss.dir * 6;
    score += 10;
    shake = 8;
    addEffect("💫", boss.x + 40, boss.y);

    if (boss.hp <= 0) {
        boss.state = "defeated";
        boss.fall = 0;
        score += 25 * level;
        shots = [];
        peels = [];
        groundBananas = [];
        banner = { title: "Besejret!", subtitle: `+${25 * level} point`, time: 90 };
    }
}

function updateShots() {
    shots = shots.filter((shot) => {
        shot.rot += 0.2;
        if (shot.rolling) {
            shot.x += shot.vx;
        } else {
            shot.vy += SHOT_GRAVITY;
            shot.x += shot.vx;
            shot.y += shot.vy;
            if (shot.y >= SHOT_GROUND_Y) {
                shot.y = SHOT_GROUND_Y;
                if (shot.kind === "banana") {
                    groundBananas.push({ x: shot.x - 13, y: SHOT_GROUND_Y - 13, width: 26, height: 26, life: GROUND_BANANA_LIFE });
                    return false;
                }
                if (!boss.stats.rollingCoconuts) {
                    addEffect("💨", shot.x, shot.y);
                    return false;
                }
                shot.rolling = true;
                shot.vx = -(3.5 + level * 0.4);
            }
        }

        if (overlaps(monkey, shotBox(shot))) {
            if (shot.kind === "banana") {
                ammo = Math.min(MAX_AMMO, ammo + 1);
                return false;
            }
            hurt();
            return false;
        }
        return shot.x > -30;
    });
}

function updateGroundBananas() {
    groundBananas = groundBananas.filter((banana) => {
        if (overlaps(monkey, banana)) {
            ammo = Math.min(MAX_AMMO, ammo + 1);
            return false;
        }
        return --banana.life > 0;
    });
}

/* ---------- Visning ---------- */

function setText(id, value) {
    const element = document.getElementById(id);
    if (element.textContent !== String(value)) {
        element.textContent = value;
    }
}

function updateUi() {
    highScore = Math.max(highScore, score);
    setText("level", level);
    setText("lives", lives);
    setText("ammo", ammo);
    setText("score", score);
    setText("highScore", highScore);
    document.body.classList.toggle("boss-mode", mode === "boss");
}

function drawEmoji(icon, centerX, centerY, size, rotation = 0, flip = false) {
    ctx.save();
    ctx.translate(centerX, centerY);
    ctx.rotate(rotation);
    if (flip) ctx.scale(-1, 1);
    ctx.font = `${size}px Arial`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#000";
    ctx.fillText(icon, 0, 0);
    ctx.restore();
}

function drawGround() {
    ctx.fillStyle = "#22c55e";
    ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
    ctx.fillStyle = "#16a34a";
    const offset = -(scroll % 120);
    for (let x = offset; x < canvas.width; x += 120) {
        ctx.fillRect(x, groundY + 14, 44, 5);
        ctx.fillRect(x + 62, groundY + 36, 36, 5);
    }
}

function drawPeel(peel) {
    ctx.save();
    ctx.translate(peel.x, peel.y);
    ctx.rotate(peel.rot);
    ctx.fillStyle = "#facc15";
    for (const angle of [-0.9, -0.3, 0.3, 0.9]) {
        ctx.save();
        ctx.rotate(angle);
        ctx.beginPath();
        ctx.ellipse(0, -9, 4.5, 11, 0, 0, TAU);
        ctx.fill();
        ctx.restore();
    }
    ctx.fillStyle = "#854d0e";
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, TAU);
    ctx.fill();
    ctx.restore();
}

function drawBoss() {
    const shakeX = boss.state === "windup" ? rand(-3, 3) : 0;
    const centerX = boss.x + BOSS_SIZE / 2 + shakeX;
    const centerY = boss.y + BOSS_SIZE / 2;
    drawEmoji(boss.icon, centerX, centerY, BOSS_SIZE, boss.spin * boss.dir, boss.dir > 0);

    if (boss.hat && boss.state !== "defeated" && boss.state !== "slip") {
        drawEmoji(boss.hat, centerX, boss.y + 2, 34);
    }
    if (boss.state === "slip") {
        drawEmoji("💫", centerX, boss.y - 4, 30, boss.time * 0.2);
    }
    if (boss.state === "windup") {
        drawEmoji("❗", centerX, boss.y - 12, 34);
    }

    if (boss.state !== "defeated") {
        const width = 280;
        const x = (canvas.width - width) / 2;
        ctx.fillStyle = "#333";
        ctx.font = "bold 22px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "alphabetic";
        ctx.fillText(boss.name, canvas.width / 2, 24);
        ctx.fillStyle = "rgba(0,0,0,0.55)";
        ctx.fillRect(x, 31, width, 14);
        ctx.fillStyle = "#ef4444";
        ctx.fillRect(x + 2, 33, (width - 4) * (boss.hp / boss.stats.hp), 10);
        ctx.fillStyle = "rgba(0,0,0,0.55)";
        for (let i = 1; i < boss.stats.hp; i++) {
            ctx.fillRect(x + (width * i) / boss.stats.hp - 1, 31, 2, 14);
        }
    }
}

function drawRunProgress() {
    const width = 180;
    const x = canvas.width - width - 44;
    const progress = Math.min(1, passed / obstaclesBeforeBoss(level));
    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.fillRect(x, 15, width, 10);
    ctx.fillStyle = "#f59e0b";
    ctx.fillRect(x, 15, width * progress, 10);
    drawEmoji("🦍", x + width + 20, 20, 26);
}

function drawBanner() {
    if (!banner) return;
    ctx.globalAlpha = Math.min(1, banner.time / 20);
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    ctx.lineJoin = "round";
    ctx.lineWidth = 6;
    ctx.strokeStyle = "#fff";
    ctx.fillStyle = "#dc2626";
    ctx.font = "bold 48px Arial";
    ctx.strokeText(banner.title, canvas.width / 2, 118);
    ctx.fillText(banner.title, canvas.width / 2, 118);
    if (banner.subtitle) {
        ctx.fillStyle = "#333";
        ctx.font = "bold 30px Arial";
        ctx.strokeText(banner.subtitle, canvas.width / 2, 158);
        ctx.fillText(banner.subtitle, canvas.width / 2, 158);
    }
    ctx.globalAlpha = 1;
}

function drawGameOver() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "white";
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    ctx.font = "bold 36px Arial";
    ctx.fillText("Game Over! 🍌", canvas.width / 2, canvas.height / 2 - 30);
    ctx.font = "bold 24px Arial";
    ctx.fillText(`Du nåede level ${level} og fik ${score} point`, canvas.width / 2, canvas.height / 2 + 10);
    ctx.font = "22px Arial";
    ctx.fillText("Tryk på mellemrum eller skærmen for at spille igen", canvas.width / 2, canvas.height / 2 + 50);
}

function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (shake > 0) {
        ctx.translate(rand(-shake, shake) * 0.6, rand(-shake, shake) * 0.6);
    }

    for (const cloud of clouds) {
        drawEmoji("☁️", cloud.x + 20, cloud.y - 10, 32);
    }
    drawGround();

    if (mode === "run") {
        drawRunProgress();
    }

    for (const obstacle of obstacles) {
        drawEmoji("🏠", obstacle.x + 18, obstacle.y + 18, 40);
    }
    for (const pickup of pickups) {
        drawEmoji(pickup.kind === "heart" ? "❤️" : "🍌", pickup.x + 13, pickup.y + 13, 26);
    }
    for (const banana of groundBananas) {
        // Blinker, når den snart forsvinder.
        if (banana.life > 90 || Math.floor(banana.life / 8) % 2 === 0) {
            drawEmoji("🍌", banana.x + 13, banana.y + 13, 26);
        }
    }
    peels.forEach(drawPeel);
    if (boss) {
        drawBoss();
    }
    for (const shot of shots) {
        drawEmoji(shot.kind === "banana" ? "🍌" : "🥥", shot.x, shot.y, 28, shot.rot);
    }

    if (monkey.invulnerable === 0 || Math.floor(monkey.invulnerable / 6) % 2 === 0) {
        drawEmoji("🐒", monkey.x + 20, monkey.y + 20, 42, 0, true);
    }
    for (const effect of effects) {
        drawEmoji(effect.icon, effect.x, effect.y, 30);
    }

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    drawBanner();
    if (mode === "gameover") {
        drawGameOver();
    }
}

// Spillet flytter alt én gang pr. billede, så det må højst køre 60 gange i sekundet,
// ellers kører det dobbelt så hurtigt på telefoner med 120 Hz-skærm.
let lastStep = 0;

function loop(now) {
    if (now - lastStep >= 1000 / 61) {
        lastStep = now;
        step();
        draw();
    }
    requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>
